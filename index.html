<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio & CV Digital - Muhammad Rizky Saputra</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Modal Login (Proteksi Akses) -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full mx-4">
            <h3 class="text-xl font-bold mb-4 text-center text-blue-900"><i class="fas fa-lock mr-2"></i>Login CV Digital</h3>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan password...">
                </div>
                <p id="login-error" class="text-red-500 text-xs mb-4 hidden">Password salah. Silakan coba lagi.</p>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Konten Utama (Ditampilkan setelah login) -->
    <div id="app-container">
        <!-- Header Navigasi Atas -->
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-id-card text-2xl text-blue-400"></i>
                    <span class="font-bold text-lg tracking-wide">CV DIGITALKU</span>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="btn-edit-mode" onclick="toggleEditMode()" class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-amber-600 hover:bg-amber-700 text-white transition flex items-center gap-1.5">
                        <i class="fas fa-edit"></i> <span id="edit-mode-text">Mode Edit: OFF</span>
                    </button>
                    <button onclick="handleCetakPDF()" class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white transition flex items-center gap-1.5">
                        <i class="fas fa-print"></i> Cetak PDF
                    </button>
                    <button onclick="handleSimpanJSON()" id="btn-save-json" class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white transition hidden items-center gap-1.5">
                        <i class="fas fa-download"></i> Simpan JSON
                    </button>
                    <button onclick="handleLogout()" class="px-3.5 py-1.5 rounded-lg text-sm font-medium bg-rose-600 hover:bg-rose-700 text-white transition flex items-center gap-1.5">
                        <i class="fas fa-sign-out-alt"></i> Keluar
                    </button>
                </div>
            </div>
        </header>

        <!-- Pilihan Profil CV (Tabs) -->
        <div class="bg-slate-800 text-white py-2 shadow-inner">
            <div class="max-w-5xl mx-auto px-4 flex justify-center gap-2 overflow-x-auto" id="profile-tabs">
                <!-- Dirender dinamis oleh script.js -->
            </div>
        </div>

        <!-- Tab Navigasi Utama: CV vs Surat Lamaran Kerja -->
        <div class="max-w-4xl mx-auto px-4 mt-6">
            <div class="flex justify-center gap-3">
                <button id="btn-tab-cv" onclick="switchTab('cv')" class="px-6 py-2.5 rounded-xl font-semibold bg-blue-600 text-white shadow-md transition flex items-center gap-2">
                    <i class="fas fa-file-alt"></i> Curriculum Vitae (CV)
                </button>
                <button id="btn-tab-surat" onclick="switchTab('surat')" class="px-6 py-2.5 rounded-xl font-semibold bg-white text-gray-700 hover:bg-gray-200 shadow-sm border border-gray-300 transition flex items-center gap-2">
                    <i class="fas fa-envelope-open-text"></i> Surat Lamaran Kerja
                </button>
            </div>
        </div>

        <!-- Kontainer Utama CV -->
        <main id="section-cv" class="max-w-4xl mx-auto my-6 px-4">
            <div id="cv-container" class="bg-white p-8 md:p-14 shadow-xl rounded-2xl mb-12 border border-gray-200">
                <!-- Konten CV akan dirender oleh script.js -->
            </div>
        </main>

        <!-- Kontainer Utama Surat Lamaran Kerja -->
        <main id="section-surat" class="max-w-3xl mx-auto my-6 px-4 hidden">
            <div id="surat-container" class="bg-white p-8 md:p-14 shadow-xl rounded-2xl mb-12 border border-gray-200 font-serif leading-relaxed text-gray-800 relative">
                <!-- Konten Surat Lamaran akan dirender oleh script.js -->
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-center py-6 text-sm mt-auto">
        <p>&copy; <span id="current-year">2026</span> Muhammad Rizky Saputra. Hak cipta dilindungi.</p>
    </footer>

    <!-- Main JavaScript -->
    <script src="script.js"></script>
</body>
</html>
