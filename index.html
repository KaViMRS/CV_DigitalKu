<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio & CV Digital - Muhammad Rizky Saputra</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%231e3a8a'/%3E%3Ctext x='50%25' y='65%25' font-size='45' font-weight='900' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'%3EMRS%3C/text%3E%3C/svg%3E">
    <!-- External Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- External JavaScript -->
    <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen pb-12">

    <!-- NAVIGASI / PROFILE SWITCHER -->
    <header class="no-print sticky top-0 z-50 bg-slate-900 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="font-bold text-lg tracking-wide text-blue-400">
                <i class="fa-solid fa-id-card mr-2"></i>CV DIGITALKU
            </div>
            
            <!-- Tombol Switch Tab (3 Profil) -->
            <div class="flex flex-wrap justify-center bg-slate-800 p-1 rounded-lg border border-slate-700 gap-1">
                <button id="btn-teleperformance" onclick="switchTab('teleperformance')" class="tab-btn active-tele">
                    <i class="fa-solid fa-headset mr-1"></i> Teleperformance
                </button>
                <button id="btn-guru" onclick="switchTab('guru')" class="tab-btn inactive">
                    <i class="fa-solid fa-chalkboard-user mr-1"></i> Guru SMK
                </button>
                <button id="btn-umum" onclick="switchTab('umum')" class="tab-btn inactive">
                    <i class="fa-solid fa-briefcase mr-1"></i> Umum / General
                </button>
            </div>

            <!-- Tombol Aksi (Edit, Download JSON, Print) -->
            <div class="flex items-center gap-2">
                <button id="btn-edit" onclick="toggleEditMode()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-2 rounded font-medium flex items-center transition">
                    <i class="fa-solid fa-pen-to-square mr-1.5"></i> Mode Edit: OFF
                </button>
                <button id="btn-download" onclick="downloadJSON()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded font-medium flex items-center transition">
                    <i class="fa-solid fa-download mr-1.5"></i> Simpan JSON
                </button>
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded font-medium flex items-center transition">
                    <i class="fa-solid fa-print mr-1.5"></i> Cetak PDF
                </button>
            </div>
        </div>
    </header>

    <!-- BANNER PERINGATAN MODE EDIT -->
    <div id="edit-banner" class="no-print hidden bg-amber-500 text-slate-900 font-bold text-center text-xs py-2 px-4 shadow-inner">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Mode Edit Aktif! Klik pada teks apapun di bawah untuk mengubahnya. Setelah selesai, klik tombol <u>"Simpan JSON"</u> di atas lalu upload ke GitHub.
    </div>

    <!-- CONTAINER UTAMA CV (Renders Dynamically from JSON) -->
    <main class="max-w-4xl mx-auto mt-6 px-4">
        <div id="cv-card-container" class="cv-card space-y-5">
            <!-- Konten CV dimuat oleh script.js secara otomatis -->
        </div>
    </main>
    <footer class="flex items-center">
        Copyright © 2026 <b>MRS</b>. All rights reserved.
    </footer>
</body>
</html>
